[project]
name = "gs2-box"
version = "0.1.0"
description = "Grounded SAM 2 workspace wrapper"
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "sam-2",
    "groundingdino",
    "supervision>=0.27",
    "transformers>=4.0,<5.0",
    "opencv-python-headless>=4.10",
    "pillow>=9.4",
    "numpy>=1.24",
    "pycocotools>=2.0",
    "addict>=2.4",
    "yapf>=0.40",
    "timm>=0.9",
    "hydra-core>=1.3",
    "iopath>=0.1",
]

[tool.uv]
package = false
no-build-isolation-package = ["sam-2", "groundingdino"]

[tool.uv.sources]
sam-2         = { path = "./source",                editable = true }
groundingdino = { path = "./source/grounding_dino", editable = true }
torch         = { index = "pytorch-cu128" }
torchvision   = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url  = "https://download.pytorch.org/whl/cu128"
explicit = true
